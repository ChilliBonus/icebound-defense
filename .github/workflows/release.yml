name: Release

# Veroeffentlicht die Spiel-PWA bei jedem Push auf main auf GitHub Pages.
# Zusaetzlich liegt die Single-File-Variante als icebound-offline.html daneben.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build single-file game
        run: python3 build_single_file.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html game.js pwa.js service-worker.js style.css manifest.webmanifest \
             scorecard.html scorecard.css scorecard.js LICENSE _site/
          cp -R icons _site/
          cp dist/icebound.html _site/icebound-offline.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
